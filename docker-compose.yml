services:
  discord-bot:
    build: .
    container_name: discord-bot
    restart: unless-stopped
    env_file:
      - .env
    # Variables d'environnement optionnelles (surcharge .env)
    environment:
      - NODE_ENV=production
    # Volumes optionnels pour persister des données (ex: base SQLite, logs)
    volumes:
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
